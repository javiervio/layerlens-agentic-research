name: Reference harvest

# GitHub Actions runners have full internet, so they can reach frontier-lab blogs
# and high-signal analyst feeds the cloud research routine cannot. Pulls recent
# posts into inbox/reference/ for the routine to read.

on:
  schedule:
    - cron: "20 5 * * 1"   # Mondays 05:20 UTC, after arxiv (05:00) and competitor (05:10), before the 09:00 research routine
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: reference-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest reference sources
        run: python tools/reference_harvest.py
      - name: Commit results
        run: |
          git config user.name "reference-harvester"
          git config user.email "actions@github.com"
          git add inbox/reference
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Reference harvest: $(date -u +%Y-%m-%d)"
            git push
          fi
